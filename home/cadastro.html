<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <title>Acampamento Meio-Sangue | Cadastro</title>
</head>

<body>
    <div class="container-all">
        <div class="lado-esquerdo"></div>
        <div class="lado-direito">
            <div class="formulario-cadastro">
                <h1>Cadastro</h1>

                <p>Já possui uma conta? <span>faça login</span></p>

                <div class="campo">
                    <label for="input_nome">Nome</label>
                    <input type="text" id="input_nome">
                </div>

                <div class="campo">
                    <label for="input_email">Email</label>
                    <input type="text" id="input_email">
                </div>

                <div class="campo">
                    <label for="input_senha">Senha</label>
                    <input type="text" id="input_senha">
                </div>

                <div class="campo">
                    <label for="input_confirmarsenha">Confirmação da Senha</label>
                    <input type="text" id="input_confirmarsenha">
                </div>
                <div id="div_senha"></div>

                <button onclick="Cadastrar()">Cadastrar</button>
                <div id="div_result"></div>
            </div>
        </div>
    </div>
</body>

</html>
