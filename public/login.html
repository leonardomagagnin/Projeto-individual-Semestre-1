<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="styles/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <title>Acampamento Meio Sangue | Login</title>
</head>

<body>
    <div class="container-all">

        <div class="lado-esquerdo">
            <div class="formulario-login">

                <h1>Bem-Vindo de Volta</h1>
                <p>Não possui cadastro? <a href="cadastro.html">crie um agora!</a></p>

                <div class="campo">
                    <label for="input_email">Email</label>
                    <input type="text" id="input_email" placeholder="Insira seu email aqui">
                </div>

                <div class="campo">
                    <label for="input_senha">Senha</label>
                    <input type="password" id="input_senha" placeholder="Insira sua senha aqui">
                    <div class="campo-mensagem" id="div_senha"></div>
                </div>

                <div class="campo-login">
                    <input type="checkbox" id="input_lembre">
                    <label for="input_lembre">Lembre-se</label>
                </div>

                <p id="p_esqueceusenha">Esqueceu a senha?</p>

                <button onclick="entrar()">Entrar</button>
                <div id="div_login"></div>
            </div>
        </div>

        <div class="lado-direito">
        </div>
    </div>
</body>

</html>

<script>
    function entrar() {

        var email = input_email.value;
        var senha = input_senha.value;

        if (email == "" || senha == "") {
            div_login.innerHTML = `<span style="color: red;">Todos os campos devem ser preenchidos!</span>`;

        } else {
            console.log("FORM LOGIN: ", email);
            console.log("FORM SENHA: ", senha);

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log('DADOS RECEBIDOS', json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;

                        div_login.innerHTML = `<span style="color: green;">Login realizado com sucesso!</span>`;

                        setTimeout(function () {
                            window.location = "./dashboard/cards.html";
                        }, 2000); // apenas para exibir o loading

                    });

                } else {

                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                        div_login.innerHTML = `<span style="color: red;">Houve um erro ao tentar realizar o login</span>`;
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })
        }
        return false;
    }


</script>
