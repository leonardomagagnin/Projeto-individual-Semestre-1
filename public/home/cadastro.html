<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <title>Acampamento Meio-Sangue | Cadastro</title>
</head>

<body>
    <div class="container-all">
        <div class="lado-esquerdo"></div>
        <div class="lado-direito">
            <div class="formulario-cadastro">
                <h1>Cadastro</h1>
                <p>Já possui uma conta? <a href="login.html">faça login</a></p>

                <div class="campo">
                    <label for="input_nome">Nome</label>
                    <input type="text" id="input_nome">
                </div>

                <div class="campo">
                    <label for="input_email">E-mail</label>
                    <input type="text" id="input_email">
                </div>

                <div class="campo">
                    <label for="input_senha">Senha</label>
                    <input type="password" onkeyup="verificar()" id="input_senha">
                    <div class="mensagem-senha" id="div_senha"></div>
                </div>

                <div class="campo">
                    <label for="input_confirmarsenha">Confirmar Senha</label>
                    <input type="password" id="input_confirmarsenha">
                </div>

                <button onclick="cadastrar()">Cadastrar</button>
                <div class="mensagem-cadastro" id="div_result"></div>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    let campos = [];
    let criterios = 0;
    function verificar() {
        let senha = input_senha.value;
        let tamanhoMinimo = senha.length >= 8;
        let temMaiusculas = senha != senha.toLowerCase();
        let temMinusculas = senha != senha.toUpperCase();

        criterios = 0
        if (tamanhoMinimo) {
            criterios++
        }
        if (temMaiusculas) {
            criterios++
        }
        if (temMinusculas) {
            criterios++
        }

        if (criterios == 3) {
            div_senha.innerHTML = `Senha Forte!`;
        } else if (criterios == 2) {
            div_senha.innerHTML = `Senha Média!`;
        } else if (criterios == 1) {
            div_senha.innerHTML = `Senha Fraca!`;
        } else {
            div_senha.innerHTML = `Senha Insegura!`;
        }
    }

    function cadastrar() {
        let nome = input_nome.value;
        let email = input_email.value;
        let senha = input_senha.value;
        let confirmarSenha = input_confirmarsenha.value;


        if (nome != '') {

            if (email.includes('@') && email.endsWith('.com')) {

                if (criterios == 3) {

                    if (confirmarSenha == senha) {
                        div_result.innerHTML = `<span style="color: green;">Cadastro Realizado com Sucesso!</span>`;

                        input_nome.value = '';
                        input_email.value = '';
                        input_senha.value = '';
                        input_confirmarsenha.value = '';
                        div_senha.innerHTML = '';

                        setTimeout (function() {
                            window.location.href='login.html'}, 2000
                        )
                    } else {
                        div_result.innerHTML = `<span style="color: red;">As senhas não são iguais!</span>`;
                    }
                } else {
                    div_result.innerHTML = `<span style="color: red;">A senha precisa ser forte!</span>`;
                }
            } else {
                div_result.innerHTML = `<span style="color: red;">Insira um e-mail válido!</span>`;
            }
        } else {
            div_result.innerHTML = `<span style="color: red;">Insira um nome de usuário!</span>`;
        }
    }
</script>
