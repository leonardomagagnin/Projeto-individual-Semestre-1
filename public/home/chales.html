<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acampamento Meio-Sangue</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/side-bar.css">
    <link rel="stylesheet" href="../styles/chales.css">
</head>

<body>
    <header>
        <div class="container-header">
               <div class="sobre-usuario">
                <h2>Olá Usuário!</h2>
                <span>Semideus não reclamado</span>
            </div>
        </div>
    </header>
    <div class="container-all">
        <div class="lado-esquerdo">

            <div class="areas-section">
                <div class="areas">
                    <div class="areas-icon">
                        <img src="../assets/img/home.svg" alt="">
                    </div>
                    <div class="area-tipo">Home</div>
                </div>
                <div class="areas">
                    <div class="areas-icon">
                        <img src="../assets/img/users-alt.svg" alt="">
                    </div>
                    <div class="area-tipo">Pavilhão</div>
                </div>
                <div class="areas">
                    <div class="areas-icon">
                        <img src="../assets/img/bank.svg" alt="">
                    </div>
                    <div class="area-tipo">Chalés</div>
                </div>
                <div class="areas">
                    <div class="areas-icon">
                        <img src="../assets/img/chart-histogram.svg" alt="">
                    </div>
                    <div class="area-tipo">Casa Grande</div>
                </div>
            </div>

            <div class="direcionadores">
                <div class="perfil-usuario">Perfil</div>
                <div class="divisor"></div>
                <div class="logout">Sair</div>
            </div>
        </div>
        <div class="lado-direito">
            <h2>Conheça os Chalés do Acampamento Meio-Sangue</h2>
            <p>Escolha um Chalé para ver sua descrição</p>

            <input type="text" placeholder="Digite o nome do chalé...">
            <div class="chales-container">
                <div class="chales-linha">
                    <div class="chale-icon">
                        <img src="../assets/img/chale-zeus.jpeg" alt="chale-zeus">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hera.jpeg" alt="chale-hera">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-poseidon.jpeg" alt="chale-poseidon">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-demeter.jpeg" alt="chale-demeter">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-ares.jpeg" alt="chale-ares">
                    </div>
                </div>
                  <div class="chales-linha">
                    <div class="chale-icon">
                        <img src="../assets/img/chale-atena.jpeg" alt="chale-atena">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-apollo.jpeg" alt="chale-apollo">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-artemis.jpeg" alt="chale-artemis">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hefesto.jpeg" alt="chale-hefesto">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-afrodite.jpeg" alt="chale-afrodite">
                    </div>
                </div>
                  <div class="chales-linha">
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hermes.jpeg" alt="chale-hermes">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-dionisio.jpeg" alt="chale-dionisio">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hades.jpeg" alt="chale-hades">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-iris.jpeg" alt="chale-iris">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hypnos.jpeg" alt="chale-hypnos">
                    </div>
                </div>
                  <div class="chales-linha">
                    <div class="chale-icon">
                        <img src="../assets/img/chale-nemesis.jpeg" alt="chale-nemesis">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-nike.jpeg" alt="chale-nike">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hebe.jpeg" alt="chale-hebe">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-tyche.jpeg" alt="chale-tyche">
                    </div>
                    <div class="chale-icon">
                        <img src="../assets/img/chale-hecate.jpeg" alt="chale-hecate">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
