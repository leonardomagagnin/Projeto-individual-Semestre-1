    <script>

        (function () {
            var nome = sessionStorage.getItem('NOME_USUARIO');
            var deus = sessionStorage.getItem('DEUS'); // definido ao responder o quiz

            var elNome = document.getElementById('nomeUsuario');
            var elStatus = document.getElementById('statusSemideus');

            if (nome && elNome) {
                elNome.innerText = nome;
            }

            if (deus && elStatus) {
                elStatus.innerText = 'Filho(a) de ' + deus;
            }
        })();

        // Filtra os cards de chalés pelo input, agrupa os encontrados enfileirados
        // e mostra mensagem quando não há resultados.
        (function () {
            const input = document.getElementById('procurarChale');
            const container = document.querySelector('.chales-container');
            if (!input || !container) return;

            // guarda HTML original para restaurar quando a busca for limpa
            const originalHTML = container.innerHTML;

            // elemento de mensagem "não encontrado" (centralizado)
            const noFound = document.createElement('div');
            noFound.textContent = 'Chalé não encontrado :(';
            noFound.style.display = 'none';
            noFound.style.marginTop = '20px';
            noFound.style.fontSize = '20px';
            noFound.style.color = '#c0392b';
            noFound.style.width = '100%';
            noFound.style.textAlign = 'center';
            noFound.style.fontFamily = "'Caesar Dressing', cursive";
            noFound.className = 'chale-nao-encontrado';
            container.parentNode.insertBefore(noFound, container.nextSibling);

            input.addEventListener('input', function () {
                const q = input.value.trim().toLowerCase();

                if (q === '') {
                    // restaura visual original
                    container.innerHTML = originalHTML;
                    noFound.style.display = 'none';
                    return;
                }

                // usa uma cópia do HTML original para garantir todos os cards
                const temp = document.createElement('div');
                temp.innerHTML = originalHTML;
                // cards agora são links <a class="card-chale"> (substituição de divs por a)
                const allCards = Array.from(temp.querySelectorAll('a.card-chale'));

                const matched = allCards.filter(card => {
                    const img = card.querySelector('img');
                    let raw = '';
                    if (img) raw = img.alt || (img.src || '').split('/').pop().split('.')[0] || '';
                    raw = raw.toString();
                    // limpa para comparação: remove prefixos como 'chale-' e caracteres não alfanuméricos
                    const clean = raw.toLowerCase().replace(/chale[-_\s]?/i, '').replace(/[^a-z0-9]/gi, '');
                    return clean.indexOf(q) !== -1;
                });

                // atualiza container: se houver matches, cria uma única linha enfileirada
                container.innerHTML = '';

                if (matched.length === 0) {
                    // nada encontrado
                    noFound.style.display = '';
                    return;
                }

                noFound.style.display = 'none';

                const line = document.createElement('div');
                line.className = 'chales-linha';
                // enfileira: alinhado à esquerda, com wrap para responsividade
                line.style.justifyContent = 'flex-start';
                line.style.flexWrap = 'wrap';
                line.style.gap = '10px';

                matched.forEach(card => {
                    const clone = card.cloneNode(true);
                    // garante que o card seja exibido (caso original tivesse display:none)
                    clone.style.display = '';
                    line.appendChild(clone);
                });

                container.appendChild(line);
            });
        })();
    </script>
