<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acampamento Meio-Sangue</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/side-bar.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>

<body>
    <div class="container-all">
        <div class="lado-esquerdo">

            <div class="container-header">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 3v18M6 3v6a6 6 0 0 0 12 0V3M9 21h6" />
                    </svg>
                </div>
                <div class="sobre-usuario">
                    <h2>Olá, <span id="nomeUsuario">Usuário!</span></h2>
                    <span id="statusSemideus">SEMIDEUS NÃO RECLAMADO</span>
                </div>
            </div>

            <div class="areas-section">
                <a href="mural.html" class="areas ativa">
                    <div class="areas-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6" />
                        </svg>
                    </div>
                    <div class="area-tipo">Home</div>
                </a>

                <a href="quiz.html" class="areas">
                    <div class="areas-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </div>
                    <div class="area-tipo">Oráculo de Delfus</div>
                </a>

                <a href="chales.html" class="areas">
                    <div class="areas-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-6 9 6M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18" />
                        </svg>
                    </div>
                    <div class="area-tipo">Chalés</div>
                </a>

                <a href="dashboard.html" class="areas">
                    <div class="areas-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
                        </svg>
                    </div>
                    <div class="area-tipo">Casa Grande</div>
                </a>
            </div>

            <div class="direcionadores">
                <div class="logout"><button>Sair</button></div>
            </div>

        </div>
        <div class="lado-direito">
            <div class="saudacoes">
                <h1>Seja Bem-Vindo ao Acampamento Meio-Sangue, Semideus!</h1>
            </div>

            <div class="card-chale">
                <div class="simbolo">Simbolo</div>
                <p>Chalé Atual</p>
                <h2>Hermes</h2>
            </div>


        </div>
    </div>
</body>

</html>
<script>
    // preenche nome do usuário e altera status de semideus quando disponível
    (function () {
        var nome = sessionStorage.getItem('NOME_USUARIO');
        var deus = sessionStorage.getItem('DEUS'); // definido ao responder o quiz

        var elNome = document.getElementById('nomeUsuario');
        var elStatus = document.getElementById('statusSemideus');

        if (nome && elNome) {
            elNome.innerText = nome;
        }

        if (deus && elStatus) {
            elStatus.innerText = 'Filho(a) de ' + deus;
        }
    })();
</script>
